<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genflix - La Mia Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="preferiti.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-danger fw-bold fs-3" href="index.html">GENFLIX</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door"></i> Torna alla Home
            </a>
        </div>
    </nav>

    <div class="container">
        <h2>La mia lista ⭐</h2>
        
        <div id="favoritesGrid">
            </div>

        <div id="emptyMessage" class="text-center d-none">
            <i class="bi bi-plus-circle"></i>
            <h3>La tua lista è vuota</h3>
            <p>Aggiungi film e serie TV cliccando sul tasto "+" nella home.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const favorites = JSON.parse(localStorage.getItem('myGenflixList')) || [];
            const grid = document.getElementById('favoritesGrid');
            const message = document.getElementById('emptyMessage');

            if (favorites.length === 0) {
                message.classList.remove('d-none');
            } else {
                favorites.forEach(movie => {
                    const cardHTML = `
                        <div class="fav-card">
                            <img src="${movie.poster}" alt="${movie.title}">
                            <div class="fav-overlay">
                                <div class="fav-title">${movie.title}</div>
                                <button class="btn-remove" onclick="removeFav('${movie.title}')">
                                    <i class="bi bi-trash"></i> Rimuovi
                                </button>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', cardHTML);
                });
            }
        });

        function removeFav(title) {
            let favorites = JSON.parse(localStorage.getItem('myGenflixList')) || [];
            favorites = favorites.filter(m => m.title !== title);
            localStorage.setItem('myGenflixList', JSON.stringify(favorites));
            location.reload(); // Aggiorna la pagina per mostrare i cambiamenti
        }
    </script>
</body>
</html>
